<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Ghost Transfer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{background:#000;color:#00ffcc;font-family:monospace;}</style>
</head>
<body class="flex flex-col items-center justify-center h-screen p-4">
    <div class="w-full max-w-sm border border-cyan-500 p-6 rounded-3xl bg-black">
        <h1 class="text-center font-bold mb-4">GHOST TRANSFER</h1>
        <div class="w-full aspect-square bg-black border border-cyan-900 mb-4 overflow-hidden relative">
            <canvas id="vortex-canvas" class="w-full h-full"></canvas>
            <video id="camera-feed" class="absolute inset-0 w-full h-full object-cover hidden" autoplay playsinline></video>
        </div>
        <div class="space-y-2">
            <input type="file" id="file-input" class="hidden" onchange="prepareFile(event)">
            <button onclick="document.getElementById('file-input').click()" class="w-full bg-cyan-900 p-2 rounded">SELECT FILE</button>
            <div class="flex gap-2">
                <button onclick="startSender()" class="flex-1 bg-green-900 p-2 rounded">SEND</button>
                <button onclick="startReceiver()" class="flex-1 bg-blue-900 p-2 rounded">RECEIVE</button>
            </div>
        </div>
        <div id="terminal" class="mt-4 text-[9px] h-16 overflow-y-auto opacity-70"></div>
    </div>
    <script src="app.js"></script>
    <script>navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
